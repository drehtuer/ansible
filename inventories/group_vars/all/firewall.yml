firewall:
  rate_limit:
    seconds: 10
    hitcount: 10
  docker:
    # carcosa runs Docker, so the DOCKER-USER chain is managed.
    enabled: true
    wan_interface: "{{ ansible_default_ipv4.interface }}"
    # No containers publish ports yet. Anything forwarded in from the
    # internet is dropped until a port is listed here.
    published:
      tcp: []
      udp: []
  rules:
    tcp:
      - port: 22
        comment: "SSH"
        rate_limit: true
      - port: 25
        comment: "SMTP(s)"
      - port: 80
        comment: "HTTP"
      - port: 443
        comment: "HTTPS"
      - port: 587
        comment: "SMTP(s) Submission"
      - port: 993
        comment: "IMAPS"
      # DNS over TCP, which is not optional for an authoritative
      # server: AXFR is TCP-only, so without this Hetzner's
      # secondaries cannot transfer the zone at all, and any answer
      # too large for UDP is retried over TCP.
      - port: 53
        comment: "DNS (TCP - AXFR and large answers)"
    udp:
      - port: 53
        comment: "DNS"
