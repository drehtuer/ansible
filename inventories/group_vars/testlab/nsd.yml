# The test hosts serve a zone for their fictional domain, so the role
# can be exercised without touching anything real. No secondary will
# ever pull it.
nsd:
  listen:
    - "{{ ip_v4 }}"
  # Overriding the role's top-level dict replaces its defaults, so
  # every required key has to be repeated - see doc/STATUS.adoc.
  # The host itself, so a test can actually complete a transfer and the
  # TSIG check is what decides the outcome. Pointed at an address that
  # can never connect - a documentation-range one, say - every attempt
  # would be refused on source address before the key was even looked
  # at, and a broken key would pass the test.
  secondaries:
    - "{{ ip_v4 }}"
  # Throwaway secret: the lab has no real secondaries, and this exists
  # so the TSIG path is the one actually exercised in testing rather
  # than the NOKEY fallback.
  tsig:
    name: transfer
    algorithm: hmac-sha256
    secret: dGVzdC10c2lnLXNlY3JldC1ub3QtdXNlZC1hbnl3aGVyZQ==
  rrl:
    size: 1000000
    ratelimit: 200
    whitelist_ratelimit: 2000
  zones:
    - name: "{{ domain }}"
      ttl: 3600
      serial: 2026081501
      soa:
        primary: "{{ hostname_fqdn }}."
        contact: "postmaster.{{ domain }}."
        refresh: 86400
        retry: 10800
        expire: 3600000
        minimum: 3600
      nameservers:
        - "{{ hostname_fqdn }}."
      records:
        - {name: "@", type: A, value: "{{ ip_v4 }}"}
        - {name: mail, type: A, value: "{{ ip_v4 }}"}
        - {name: www, type: CNAME, value: "{{ domain }}."}
