# Mirrors roles/backup/defaults/main.yml, because an inventory dict
# REPLACES the role default rather than merging into it - so this file
# has to repeat every key the role reads, not only the ones that
# differ. See doc/STATUS.adoc.
#
# Split per environment rather than living in group_vars/all, for the
# reason inventories/machines.yml gives: the repository password is a
# credential, and credentials above all are what keeps production's
# out of the test machines.
backup:
  repository: /var/backups/restic
  password: !vault |
            $ANSIBLE_VAULT;1.1;AES256
            32376562336432613839356531386338376364646536343136653864313636363835326231663230
            3030323764316663376237653535393834346665393664610a613265663139383131616137353834
            37666536323666383439643935653232613536313930313539363339656165373866353638386333
            6366663737333665620a383132653066386266363265396136616432646262666536653237613161
            30663562333335323836393265363930396135633633386336643331633361343065653466323461
            3165613037326537626366633731373733613266613339313932
  password_file: /etc/restic/password
  mysql:
    enabled: true
    dump_dir: /var/backups/mysql
    login_user: root
    login_password: "{{ database.mysql.root.password }}"
    defaults_file: /etc/restic/mariadb.cnf
    skip_databases:
      - information_schema
      - performance_schema
      - sys
  nextcloud:
    enabled: true
    path: /var/www/nextcloud
  paths:
    - /var/backups/mysql
    - /home
    - /var/lib/rspamd/dkim
    - /etc/letsencrypt
    - /var/www/nextcloud/config
    - /var/www/nextcloud/data
  exclude_file: /etc/restic/excludes
  excludes:
    - dovecot.index*
    - dovecot.list.index*
    - /var/www/nextcloud/data/appdata_*/preview
    - /var/www/nextcloud/data/*/cache
    - /var/www/nextcloud/data/*/uploads
    - /var/www/nextcloud/data/nextcloud.log*
  retention:
    daily: 14
    weekly: 8
    monthly: 12
    yearly: 3
  schedule:
    on_calendar: "*-*-* 02:30:00"
    randomized_delay: 15min
  check:
    enabled: true
    on_calendar: "Sun *-*-* 05:00:00"
    randomized_delay: 15min
    read_data_subset: 5%
  metrics:
    enabled: true
    textfile_dir: /var/lib/prometheus/node-exporter
