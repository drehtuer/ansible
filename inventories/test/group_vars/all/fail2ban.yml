fail2ban:
  defaults:
    bantime: 1h
    findtime: 10m
    maxretry: 5
  jails:
    - name: recidive
      port: all
      filter: recidive
      backend: auto
      logpath: /var/log/fail2ban.log
      bantime: 1w
      findtime: 1d
      maxretry: 3
    - name: sshd
      port: ssh
      filter: sshd
      backend: systemd
    - name: nginx-404
      port: https
      filter: nginx-404
      backend: auto
      logpath: /var/log/nginx/access.log
      maxretry: 20
