# Authoritative zone data for this host.
#
# `drehtuer.net` was transcribed from what ns1.first-ns.de served on
# 2026-08-15, before the primary moved here. `drehtuer.de` was
# transcribed the same way on 2026-08-16 and then extended: what
# Hetzner served for it was only an apex A, an MX pointing at the apex,
# `v=spf1 mx -all`, and A records for `www` and `mail`, all aimed at
# 78.46.107.174 - a different host. The zone below aims every name at
# this one and gives the domain the same shape `drehtuer.net` has.
#
# Neither domain is DNSSEC-signed and neither has a DS record in its
# parent (checked against the .de/.net delegations on 2026-08-16), so
# moving a primary here breaks no chain of trust. That also means the
# DNSSEC question in doc/TODO.adoc now covers two zones rather than one.
#
# This host is a *hidden primary*: the NS records still point at
# Hetzner's nameservers, which pull each zone from here by AXFR. The
# world queries them, so an outage here does not take a zone down - it
# only stops updates propagating.
#
# Bump a zone's `serial` on every change to it. Secondaries compare
# serials and will keep serving their old copy if it does not increase.
#
# The zone list is deliberately NOT derived from `domain` /
# `domain_aliases` the way `http.domains` is. Those say which domains
# this host *serves*; this file says which zones it is *authoritative*
# for, and the two are not the same question - a served domain whose
# DNS stays elsewhere has no zone here. A zone also needs hand-written
# records, its own serial and its own transfer key, none of which can
# be derived from a domain name.
nsd:
  # Overriding the role's top-level dict replaces its defaults, so
  # every key the role requires is repeated here even where the value
  # matches the default - see doc/STATUS.adoc.
  #
  # Hetzner's secondary nameservers: the only addresses allowed to
  # transfer these zones, and the ones notified when one changes. The
  # same three serve both domains.
  # https://docs.hetzner.com/de/networking/dns/overview
  secondaries:
    - 213.239.242.238      # ns1.first-ns.de
    - 2a01:4f8:0:a101::a:1
    - 213.133.100.103      # robotns2.second-ns.de
    - 2a01:4f8:0:1::5ddc:2
    - 193.47.99.3          # robotns3.second-ns.com
    - 2001:67c:192c::add:a3
  # IPv4 only - Hetzner refuses a NOTIFY from this host's IPv6 address
  # whatever key signs it. See nsd.notify in roles/nsd/defaults.
  notify:
    - 213.239.242.238      # ns1.first-ns.de
    - 213.133.100.103      # robotns2.second-ns.de
    - 193.47.99.3          # robotns3.second-ns.com
  rrl:
    size: 1000000
    ratelimit: 200
    whitelist_ratelimit: 2000
  listen:
    - "{{ ip_v4 }}"
    - "{{ ip_v6 }}"
  zones:
    - name: "{{ domain }}"
      ttl: 3600
      serial: 2026081503
      # Shared secret authenticating the AXFR of this zone to Hetzner's
      # secondaries, so they can verify it came from here unaltered.
      # Each zone has its own key; see `drehtuer.de` below.
      #
      # The name is NOT free to choose. Hetzner's console takes only
      # the algorithm and the secret, and derives the key name itself
      # as "<zone>.<primary-ip>." - so it must be written out here
      # exactly as they send it. Getting it wrong is not a soft
      # failure: NSD answers BADKEY, no transfer ever succeeds, and
      # once their copy passes the SOA expire time they stop answering
      # for the zone entirely and the domain goes dark. Recovering
      # means fixing the name and waiting for the transfer, so check
      # the name against a real transfer attempt
      # (`journalctl -u nsd | grep tsig`) rather than assuming.
      tsig:
        name: drehtuer.net.88.198.12.17.
        algorithm: hmac-sha256
        secret: !vault |
            $ANSIBLE_VAULT;1.1;AES256
            32376362383262663463363139623062346434393734343731323337626366323164346232666362
            3761646462623631326431306638613565633266623434340a386161343537333038643262316139
            38633036343265373635323439326434386361303835623039623730643535316235306530373937
            3562336238333138340a376531646238353632633037393034373665386537366266666163303331
            35343534643865643066626233316664633535363036666334643163323166626566323261326264
            6265366233383336633936623137646233386164623032393236
      soa:
        primary: ns1.first-ns.de.
        contact: dns.hetzner.com.
        refresh: 86400
        retry: 10800
        expire: 3600000
        minimum: 3600
      nameservers:
        - ns1.first-ns.de.
        - robotns2.second-ns.de.
        - robotns3.second-ns.com.
      records:
        - {name: "@", type: A, value: "{{ ip_v4 }}"}
        - {name: "@", type: AAAA, value: "{{ ip_v6 }}"}
        - {name: "@", type: MX, value: "10 mail.{{ domain }}."}
        # SPF: only this host may send for the domain, hard fail
        # otherwise. Keep in step with the addresses above.
        - {name: "@", type: TXT,
           value: '"v=spf1 ip4:{{ ip_v4 }} ip6:{{ ip_v6 }} -all"'}
        # Only Let's Encrypt may issue, and no wildcards at all.
        - {name: "@", type: CAA, value: '128 issue "letsencrypt.org"'}
        - {name: "@", type: CAA, value: '128 issuewild ""'}
        - {name: "@", type: CAA, value: '128 iodef "mailto:root@{{ domain }}"'}
        # The host itself, and the name every TLS consumer reads out of
        # /etc/letsencrypt/live/. Only this zone carries it: the
        # certificate lineage is named after the host's FQDN, which is
        # in this domain and not in the alias domain.
        - {name: "{{ hostname }}", type: A, value: "{{ ip_v4 }}"}
        - {name: "{{ hostname }}", type: AAAA, value: "{{ ip_v6 }}"}
        # mail is an A/AAAA rather than a CNAME on purpose: it is the
        # MX target, and a CNAME there is invalid.
        - {name: mail, type: A, value: "{{ ip_v4 }}"}
        - {name: mail, type: AAAA, value: "{{ ip_v6 }}"}
        # Everything else the http role serves points at the apex.
        - {name: www, type: CNAME, value: "{{ domain }}."}
        - {name: cloud, type: CNAME, value: "{{ domain }}."}
        - {name: spam, type: CNAME, value: "{{ domain }}."}
        - {name: status, type: CNAME, value: "{{ domain }}."}
        # DMARC is p=reject with strict alignment, so a message that
        # fails both SPF and DKIM is discarded rather than quarantined.
        - name: _dmarc
          type: TXT
          value: >-
            "v=DMARC1; p=reject; rua=mailto:postmaster@{{ domain }};
            adkim=s; aspf=s"
        # DKIM. This is the ed25519 key generated before the signing
        # role switched to RSA; the private half is still on the host,
        # so the published record and the signer agree. Replacing it
        # means generating a new key, publishing the new record, and
        # only then removing the old one.
        # Two quoted strings, not one: DNS concatenates them, and it
        # keeps the base64 off an over-long line without folding a
        # space into the middle of the key, which would break it.
        - name: mail._domainkey
          type: TXT
          value: >-
            "v=DKIM1; k=ed25519; "
            "p=9w24peXmzA+r8Z3oodRBfeYChYc/YXx2vyD0Zv5N1x4="
        # The RSA replacement, published alongside the ed25519 record
        # above rather than instead of it. Gmail, Microsoft 365 and
        # Yahoo do not verify ed25519-sha256 at all - Gmail answers
        # `dkim=neutral (no key)` - so with DMARC p=reject this domain
        # effectively had no working DKIM at the three biggest
        # receivers, leaving DMARC to rest entirely on SPF. SPF is what
        # breaks when mail is forwarded, which is precisely the case
        # DKIM exists to survive.
        #
        # Both records stay published until no mail signed with the old
        # key can still be in flight; removing the ed25519 one is
        # tracked in doc/TODO.adoc. A new selector rather than a
        # replacement under `mail` is what makes the switch seamless:
        # the new name was never cached, so there is no window in which
        # a receiver holds the old record and sees a new signature.
        - name: s202608._domainkey
          type: TXT
          value: >-
            "v=DKIM1; k=rsa; "
            "p=MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAkfzWt1KzHR"
            "BfjU3VjQUo7eooaaebgY/Xusk7QoJ38jQ5surauuCaEt5q9yOIO6uZ"
            "jkufOorLnE6XC62FSf1iKj/PXgfb20lMgPFKBfh/mkiNifoG7I6uhJ"
            "l6T5u8/BqrJ+hYJx7Y6cUSkE8zaLOlaps7y+8Hz5zmRe4gK42Tilrl"
            "e4MWPNVw05xPEMlUgl1TVEG6ZaE7QQs9/bS2lA41Ptj9fTjk+ZnNjc"
            "1mkLSb1Bq4a8vxk1VgUWXl5uK94oNvtF3NJSex1rbM7VbgpmpYz4O/"
            "Vn7JZ0JQ36Aq5Z3CexmkoVh6QwUOb59STOmVveLOsTFHz0Y/5+OLUH"
            "VYL4LFywIDAQAB"
    # The secondary domain, written out rather than derived: see the
    # note at the top of this file. Same shape as the zone above, so
    # both domains offer the same subdomains and the same policy -
    # which is what the http, cloud, spam and mail roles already assume
    # when they fan out over `[domain] + domain_aliases`.
    #
    # `drehtuer.de` is spelled literally here rather than as
    # `domain_aliases[0]`: the record values below name it a dozen
    # times, and an indexed reference reads worse than the name itself
    # while silently changing meaning if the alias list is reordered.
    - name: drehtuer.de
      ttl: 3600
      serial: 2026081603
      # A different secret from the zone above, and necessarily a
      # different name - Hetzner derives it from the zone, so the two
      # could not collide even if they shared a secret. Keeping the
      # secrets separate as well means rotating one domain's key never
      # touches the other's, and a leak costs one zone.
      #
      # Register it in Hetzner's console together with the algorithm
      # when converting this zone to a secondary of this host. Read it
      # back - selected by zone name, so reordering this list cannot
      # print the wrong key - with:
      #   ansible -i inventories/machines.yml carcosa \
      #     -m ansible.builtin.debug -a "msg={{ nsd.zones
      #     | selectattr('name','eq','drehtuer.de')
      #     | map(attribute='tsig') | first }}"
      tsig:
        name: drehtuer.de.88.198.12.17.
        algorithm: hmac-sha256
        secret: !vault |
            $ANSIBLE_VAULT;1.1;AES256
            61393530323134386636323064313231346430373466323462386436633964386537656266626564
            6464646335336566636537646633336261613537363631300a633262623766373937376135643438
            36653562353237346532323865323061616333343266626438336261346633363966393062386434
            3766316561633132310a653732636163343532333438353431363337306534643630353962313436
            65373961633866313231303162353734613334383266346336346564313232633534306636396564
            3937343466643737373433353430396630646533356561396533
      soa:
        primary: ns1.first-ns.de.
        contact: dns.hetzner.com.
        refresh: 86400
        retry: 10800
        expire: 3600000
        minimum: 3600
      nameservers:
        - ns1.first-ns.de.
        - robotns2.second-ns.de.
        - robotns3.second-ns.com.
      records:
        - {name: "@", type: A, value: "{{ ip_v4 }}"}
        - {name: "@", type: AAAA, value: "{{ ip_v6 }}"}
        # Its own MX rather than the primary domain's: mail.drehtuer.de
        # is on the certificate and resolves here, so the domain stands
        # on its own. Postfix accepts it because the mail role lists
        # every alias domain in virtual_mailbox_domains.
        - {name: "@", type: MX, value: "10 mail.drehtuer.de."}
        # Replaces the `v=spf1 mx -all` Hetzner served: identical in
        # effect while the MX pointed at the only sending host, but the
        # addresses are what actually authorise this host, and naming
        # them keeps the record true if the MX ever changes.
        - {name: "@", type: TXT,
           value: '"v=spf1 ip4:{{ ip_v4 }} ip6:{{ ip_v6 }} -all"'}
        - {name: "@", type: CAA, value: '128 issue "letsencrypt.org"'}
        - {name: "@", type: CAA, value: '128 issuewild ""'}
        - {name: "@", type: CAA, value: '128 iodef "mailto:root@drehtuer.de"'}
        - {name: mail, type: A, value: "{{ ip_v4 }}"}
        - {name: mail, type: AAAA, value: "{{ ip_v6 }}"}
        - {name: www, type: CNAME, value: drehtuer.de.}
        - {name: cloud, type: CNAME, value: drehtuer.de.}
        - {name: spam, type: CNAME, value: drehtuer.de.}
        - {name: status, type: CNAME, value: drehtuer.de.}
        - name: _dmarc
          type: TXT
          value: >-
            "v=DMARC1; p=reject; rua=mailto:postmaster@drehtuer.de;
            adkim=s; aspf=s"
        # DKIM. RSA-2048, generated by the spam role's key script on
        # 2026-08-15 and published here on 2026-08-16 - the record could
        # not exist before the key did, which is why this zone went live
        # without it.
        #
        # Transcription is the whole risk with a record like this, so it
        # was not transcribed: the base64 was taken from
        # `openssl rsa -pubout -outform DER | base64` against the very
        # key RSpamd signs with, and the rendered zone was reassembled
        # and compared back to that value before deploying.
        #
        # Split across many quoted strings rather than the two the
        # ed25519 record above needs. DNS concatenates the strings with
        # nothing between them, so the split is invisible to a verifier,
        # and each fragment has to stay under both the 255-character
        # limit for one TXT character-string and this repo's 80-column
        # YAML rule. The folded scalar joins these lines with a space,
        # which lands *between* quoted strings and therefore outside the
        # key - folding a space into the middle of the base64 would
        # break it.
        - name: mail._domainkey
          type: TXT
          value: >-
            "v=DKIM1; k=rsa; "
            "p=MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEApOhJemGl+W"
            "f/YqaYAzrZIkccjaZ3F0WcEYW5H6pxRWbMcEiMN0AZoImaOBF82UNh"
            "mCnVzC4YXdbEvLrn8KDi5v/t29V6H8+kBAlzhi3qA4NC1zCiyvvrm2"
            "RV9CR1i+e/4H+Xd01C9zGDwBUWAUKYe7lkqA0JXi6rVoSS2gENveXX"
            "mO/eyQ7s5cSoQDDoU6DLxj1izpptXyFuGNFki/EeIHQgZjzcJa5F2v"
            "m0LM7pibYZyesS1uvOfEt0F4GWdjBgZ7R09mYZSyCvCNaHabDAXXWv"
            "YI65gDILufYobiIOybsBEwi1I2WezwZJRtuHyUHgA7GCiCuau65nhe"
            "d4n7/E8QIDAQAB"
        # Same rotation as drehtuer.net. This key is RSA either way, so
        # nothing was wrong with the `mail` one - but the selector is a
        # single global setting shared by both domains (spam.dkim), so
        # rotating one rotates both. That is a deliberate property of
        # the role rather than an accident: one selector means the
        # signing config cannot drift out of step with the keys.
        - name: s202608._domainkey
          type: TXT
          value: >-
            "v=DKIM1; k=rsa; "
            "p=MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA1KHLXCm0G4"
            "crlu0rAbqTKWGc8kiHa/HQ2AfG9xSiq8glakOmGRuGe7Izj90fKtpv"
            "n4thZdfEEUNmUEXaNSQ07ovQqU+y3cfG82hQX5wUgzRwneLHFohqIG"
            "KPKTs92wIcSvoadcVlN6ci1XhkgpAPlYWxfJNQMyWMt1r/2DpcEYYA"
            "XavledO88fv+F8308e5mwffnFOWIXnnDGo5c7Wx1INJeacHcjax38o"
            "LGM8Y+5iZH6aLVJo5X7I/R6Oz/Plc2EKTG79gphLh7jMM5ZwdxhKfz"
            "/WqqVWrEUqoHovthngP5C1yI716P6FWPv+USWrZjVGBRtKPXFIutgf"
            "nfVwPDkQIDAQAB"
