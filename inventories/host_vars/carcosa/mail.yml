# Everything about this host's mail that is not an address.
#
# The alias list used to live here too, and until 2026-08-18 it was
# readable by anyone: this repository is public, and only two of the
# entries carried inline `!vault`. Encrypting the whole file was the
# first fix and the wrong shape - it took the ssl paths and the
# structure of the dict out of view along with the addresses, and a
# vault-encrypted file cannot be diffed, reviewed or grepped.
#
# So the addresses moved to mail_aliases.yml, which is encrypted whole,
# and this file references them. `mail` has to be defined in exactly
# one place - overriding a role's top-level dict replaces the role
# default rather than merging into it, so the two halves cannot simply
# be two files both declaring `mail:` - which is why the split is by
# *variable* and joined by reference here rather than by Ansible.
mail:  # noqa: var-naming[no-role-prefix] - see doc/STATUS.adoc
  aliases: "{{ mail_aliases }}"
  ssl:
    cert: /etc/letsencrypt/live/{{ hostname_fqdn }}/fullchain.pem
    key: /etc/letsencrypt/live/{{ hostname_fqdn }}/privkey.pem
