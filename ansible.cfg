# https://docs.ansible.com/ansible/latest/reference_appendices/config.html
[defaults]
# Local roles
roles_path = roles
# Only decrypt with matching
# password/provider
vault_id_match = true
vault_password_file = vault/secret.txt
# Enable logging
log_path = log/ansible.log

[privilege_escalation]
# sshd denies root login, so every play connects as the
# unprivileged `ansible_user` from the inventory and escalates
# here. The `users` role grants %sudo NOPASSWD, which is what
# makes this work without an interactive password.
#
# No task in this repo is delegated to localhost, so escalating
# unconditionally is safe.
become = true
become_method = sudo
become_user = root
