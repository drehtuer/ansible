# https://docs.ansible.com/ansible/latest/reference_appendices/config.html
[defaults]
# Local roles
roles_path = roles
# Deliberately drops /usr/share/ansible/collections from the default
# search path, which would otherwise be the second entry.
#
# The distribution's `ansible` package ships around 50 collections
# inside /usr/lib/python3/dist-packages/ansible_collections, and those
# are found through sys.path rather than through this setting - so
# they stay available whatever is listed here, community.mysql and
# community.general among them. The dev container additionally
# installs three of the same collections from Galaxy into
# /usr/share/ansible/collections, for the molecule virtualenv, which
# has an ansible-core of its own and cannot see dist-packages.
#
# With both on the path every run warned three times that a second
# copy had been found - and the copy actually used was the
# distribution's, not the newer one from Galaxy, so the duplicates
# were dead weight that only produced noise. Molecule is unaffected:
# it generates its own ansible.cfg and never reads this file.
collections_path = ~/.ansible/collections
# Only decrypt with matching
# password/provider
vault_id_match = true
vault_password_file = vault/secret.txt
# Enable logging
log_path = log/ansible.log

[privilege_escalation]
# sshd denies root login, so every play connects as the
# unprivileged `ansible_user` from the inventory and escalates
# here. The `users` role grants %sudo NOPASSWD, which is what
# makes this work without an interactive password.
#
# No task in this repo is delegated to localhost, so escalating
# unconditionally is safe.
become = true
become_method = sudo
become_user = root
