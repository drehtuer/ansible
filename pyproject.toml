# https://docs.astral.sh/ruff
[tool.ruff]
exclude = [
  ".adoc",
  ".devcontainer",
  ".vscode",
  "doc",
]

indent-width = 2
target-version = "py312"

[tool.ruff.lint]
# https://docs.astral.sh/ruff/rules/
select = [
  # pyflakes
  "F",
  # pycodestyle
  "E",
  "W",
  # import sort
  "I",
  # naming
  "N",
  # pydocstyle
  "D",
  # pyupgrade
  "UP",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
]
ignore = [
  # pydocstyle
  "D200",
  # Mutually exclusive with D211, which is the
  # one this repo follows. Listing it keeps ruff
  # from warning about the conflict on every run.
  "D203",
  "D205",
  "D212",
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
