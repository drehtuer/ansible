# Override with own variables
users:  # noqa: var-naming[no-role-prefix] - see doc/STATUS.adoc
  # Grant %sudo passwordless sudo. Ansible relies on this to escalate
  # non-interactively (see [privilege_escalation] in ansible.cfg);
  # disabling it means passing --ask-become-pass on every run.
  sudo_nopasswd: true
  # Manage authorized_keys authoritatively: keys not listed below are
  # removed from the host. Set to false to only ever add keys.
  authorized_keys_exclusive: true
  users:
    # Default user root
    - name: "root"
      group: "root"
      shell: "/usr/bin/sh"
      groups: ""
      create_home: true
      password: "*"
  authorized_keys:
    - name: "root"
      public_key: ""
