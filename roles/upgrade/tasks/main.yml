- name: Ensure this role only targets Ubuntu
  ansible.builtin.assert:
    that:
      - ansible_distribution == "Ubuntu"
    fail_msg: "The upgrade role only supports Ubuntu, found {{ ansible_distribution }}."

- name: Ensure a target release is configured
  ansible.builtin.assert:
    that:
      - upgrade.target_release | length > 0
    fail_msg: >-
      upgrade.target_release is not set. Set it (e.g. "26.04") in
      inventories/host_vars/<host>/upgrade.yml before running this role.

- name: Check whether the target release is already reached
  ansible.builtin.set_fact:
    upgrade_target_reached: "{{ ansible_distribution_version is version(upgrade.target_release, '>=') }}"

- name: Report current vs. target release
  ansible.builtin.debug:
    msg: >-
      Current release {{ ansible_distribution_version }},
      target {{ upgrade.target_release }},
      {{ 'nothing to do' if upgrade_target_reached else 'upgrade needed' }}.

- name: Upgrade to the target release
  when: not upgrade_target_reached
  block:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Fully upgrade the current release before switching release
      ansible.builtin.apt:
        upgrade: full
        autoremove: true

    - name: Install the release upgrade tool
      ansible.builtin.apt:
        name: ubuntu-release-upgrader-core
        install_recommends: false

    - name: Set release-upgrade prompt mode
      ansible.builtin.lineinfile:
        path: /etc/update-manager/release-upgrades
        regexp: '^Prompt='
        line: "Prompt={{ upgrade.prompt }}"

    # do-release-upgrade can run for well over an hour and briefly
    # interrupts networking partway through; async/poll lets this task
    # survive that instead of depending on one unbroken SSH connection.
    - name: Run do-release-upgrade
      ansible.builtin.command:
        cmd: do-release-upgrade -f DistUpgradeViewNonInteractive -m server
      environment:
        DEBIAN_FRONTEND: noninteractive
      async: "{{ upgrade.async_timeout }}"
      poll: "{{ upgrade.poll_interval }}"
      register: upgrade_result
      changed_when: true

    - name: Reboot into the new release
      ansible.builtin.reboot:
        reboot_timeout: "{{ upgrade.reboot_timeout }}"

    - name: Re-gather facts after reboot
      ansible.builtin.setup:

    - name: Verify the target release was reached
      ansible.builtin.assert:
        that:
          - ansible_distribution_version is version(upgrade.target_release, '>=')
        fail_msg: >-
          After upgrade and reboot, release is still {{ ansible_distribution_version }},
          expected at least {{ upgrade.target_release }}.
