- name: Restart nginx
  ansible.builtin.systemd_service:
    name: nginx
    daemon_reload: true
    state: restarted
    enabled: true
- name: Reload nginx
  ansible.builtin.systemd_service:
    name: nginx
    state: reloaded
    enabled: true
# No certbot handlers: certbot.service is a oneshot with no [Install]
# section, so `enabled` and `reloaded` both fail on it. Renewal is
# scheduled by certbot.timer, enabled as a task, and the deploy hook
# reloads whatever is using the certificate.
- name: Restart php-fpm
  ansible.builtin.systemd_service:
    name: "php{{ http_php_version }}-fpm"
    daemon_reload: true
    state: restarted
    enabled: true
