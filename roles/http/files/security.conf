# security headers
#
# X-XSS-Protection is deliberately absent: it is ignored by current
# browsers and the filter it enabled in older ones introduced its own
# vulnerabilities. Sending nothing is the current guidance.
add_header X-Content-Type-Options    "nosniff" always;
add_header Referrer-Policy           "no-referrer-when-downgrade" always;
# The blanket `http: https:` sources this used to allow meant any
# origin on the internet could supply script, style or frames - which
# is barely a policy at all. Narrowed to this origin, with inline
# style and script still permitted because the RSpamd web UI proxied
# at spam.<domain> includes this file and needs them. Removing those
# two needs the UI re-tested in a browser, not just a status code.
add_header Content-Security-Policy   "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
add_header Permissions-Policy        "interest-cohort=()" always;
# One year, which is what a preload-list submission would require, but
# deliberately without the `preload` token: sending it is the consent
# signal hstspreload.org checks for, and getting a domain removed from
# that list again takes months of browser releases. Every other HSTS
# header in this repo repeats this exact value - see doc/STATUS.adoc
# for why they cannot just inherit it.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# . files
location ~ /\.(?!well-known) {
    deny all;
}
