# security headers
add_header X-XSS-Protection          "1; mode=block" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header Referrer-Policy           "no-referrer-when-downgrade" always;
add_header Content-Security-Policy   "default-src 'self' http: https: ws: wss: data: blob: 'unsafe-inline'; frame-ancestors 'self';" always;
add_header Permissions-Policy        "interest-cohort=()" always;
# One year, which is what a preload-list submission would require, but
# deliberately without the `preload` token: sending it is the consent
# signal hstspreload.org checks for, and getting a domain removed from
# that list again takes months of browser releases. Every other HSTS
# header in this repo repeats this exact value - see doc/STATUS.adoc
# for why they cannot just inherit it.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# . files
location ~ /\.(?!well-known) {
    deny all;
}
