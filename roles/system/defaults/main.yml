# `hostname_fqdn` has no default on purpose - it is host specific and
# comes from the inventory. See meta/argument_specs.yml.
system:  # noqa: var-naming[no-role-prefix] - see doc/STATUS.adoc
  locales:
    # Normalised to the UTF-8 spelling so these match the names in
    # locale_gen below.
    locale: en_US.UTF-8
    locale_time: en_GB.UTF-8
    # Locales to generate, as passed to locale-gen.
    locale_gen:
      - en_US.UTF-8
      - en_GB.UTF-8
