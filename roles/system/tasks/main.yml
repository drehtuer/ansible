- name: Install dependencies
  ansible.builtin.apt:
    install_recommends: false
    name:
      - hostname
      - locales
- name: Set hostname
  # Tagged so molecule can skip it - `sethostname()` fails even in a
  # privileged container ("Device or resource busy"). See
  # roles/system/molecule/default/molecule.yml.
  ansible.builtin.hostname:
    name: "{{ hostname_fqdn }}"
  tags:
    - hostname
- name: Configure hosts file
  # No handler: nothing needs restarting, and the next lookup on the
  # host reads the file directly.
  #
  # Tagged so molecule can skip it, for the same reason as the
  # hostname task above: Docker bind-mounts /etc/hosts into the
  # container, so the atomic rename this module ends with fails on it
  # with "Device or resource busy". `unsafe_writes` would get past
  # that by writing in place, but it would apply on the real hosts
  # too, where a write interrupted partway would leave a truncated
  # resolution table behind. See roles/system/molecule/default.
  ansible.builtin.template:
    src: templates/hosts.j2
    dest: /etc/hosts
    owner: root
    group: root
    mode: "0644"
  tags:
    - hosts
- name: Generate locales
  # Edits /etc/locale.gen and runs locale-gen, but only for locales
  # that are not built yet - unlike the previous template plus
  # unconditional `locale-gen` command.
  community.general.locale_gen:
    name: "{{ item }}"
  loop: "{{ system.locales.locale_gen }}"
  notify:
    - Set default locales
    - Set LANG
