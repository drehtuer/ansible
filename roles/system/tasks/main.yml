- name: Install dependencies
  ansible.builtin.apt:
    install_recommends: false
    name:
      - hostname
      - locales
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ hostname_fqdn }}"
- name: Generate locales
  # Edits /etc/locale.gen and runs locale-gen, but only for locales
  # that are not built yet - unlike the previous template plus
  # unconditional `locale-gen` command.
  community.general.locale_gen:
    name: "{{ item }}"
  loop: "{{ system.locales.locale_gen }}"
  notify:
    - Set default locales
    - Set LANG
