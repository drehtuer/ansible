- name: Reload nginx
  ansible.builtin.systemd_service:
    name: nginx
    state: reloaded
    enabled: true
- name: Reload PHP-FPM
  ansible.builtin.systemd_service:
    name: "php{{ cloud_php_version }}-fpm"
    state: reloaded
    enabled: true
- name: Restart notify_push
  ansible.builtin.systemd_service:
    name: notify_push
    state: restarted
    daemon_reload: true
