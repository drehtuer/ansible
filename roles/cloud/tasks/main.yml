- name: Install Nextcloud and dependencies
  ansible.builtin.apt:
    install_recommends: false
    name: "{{ cloud_packages + cloud_ocr_packages }}"
  vars:
    cloud_packages:
      - php-mysql
      - php-zip
      - php-dom
      - php-mbstring
      - php-curl
      - php-gd
      - php-bcmath
      - php-imagick
      - php-intl
      - php-gmp
      # The two cache backends configured in cache.config.php below.
      # Nextcloud lists apcu as a recommended module and reports it as
      # missing without this.
      - php-apcu
      - php-redis
      - unzip
      - bzip2
      - curl
      - imagemagick
      # Nextcloud looks for the OCRmyPDF CLI on $PATH.
      - ocrmypdf
    # Tesseract ships its training data one package per language and
    # ocrmypdf only depends on English, so every other language has to
    # be installed explicitly.
    cloud_ocr_packages: >-
      {{ cloud.ocr.languages
         | map('regex_replace', '^', 'tesseract-ocr-') | list }}
  notify:
    # php-apcu and php-redis are only loaded once the running workers
    # are replaced.
    - Reload PHP-FPM
- name: Detect PHP version
  ansible.builtin.command:
    cmd: php -r "echo PHP_MAJOR_VERSION . '.' . PHP_MINOR_VERSION;"
  changed_when: false
  register: cloud_php_version_cmd
- name: Set PHP facts
  ansible.builtin.set_fact:
    cloud_php_version: "{{ cloud_php_version_cmd.stdout | trim }}"
    cloud_fpm_socket: /run/php/nextcloud-fpm.sock
    cloud_archive: "nextcloud-{{ cloud.nextcloud.version }}.tar.bz2"
- name: Create Nextcloud database
  community.mysql.mysql_db:
    name: "{{ cloud.mysql.nextcloud.database }}"
    state: present
    login_user: "{{ cloud.mysql.root.user }}"
    login_password: "{{ cloud.mysql.root.password }}"
- name: Create Nextcloud database user
  community.mysql.mysql_user:
    name: "{{ cloud.mysql.nextcloud.user }}"
    password: "{{ cloud.mysql.nextcloud.password }}"
    host: localhost
    column_case_sensitive: false
    priv: "{{ cloud.mysql.nextcloud.database }}.*:ALL"
    state: present
    login_user: "{{ cloud.mysql.root.user }}"
    login_password: "{{ cloud.mysql.root.password }}"
- name: Nextcloud folder
  ansible.builtin.file:
    path: "{{ cloud.nextcloud.path }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"
# Install only, never upgrade. Unpacking a newer release over a live
# installation without running `occ upgrade` breaks it, and that step
# is not automated yet (see doc/TODO.adoc), so the presence of
# version.php gates the whole download.
- name: Check whether Nextcloud is already installed
  ansible.builtin.stat:
    path: "{{ cloud.nextcloud.path }}/version.php"
  register: cloud_installed
- name: Download Nextcloud
  ansible.builtin.get_url:
    url: >-
      https://download.nextcloud.com/server/releases/{{ cloud_archive }}
    dest: "/tmp/{{ cloud_archive }}"
    checksum: "sha256:{{ cloud.nextcloud.checksum }}"
    owner: root
    group: root
    mode: "0644"
  when: not cloud_installed.stat.exists
- name: Extract Nextcloud
  ansible.builtin.unarchive:
    src: "/tmp/{{ cloud_archive }}"
    dest: "{{ cloud.nextcloud.path }}"
    remote_src: true
    extra_opts: [--strip-components=1]
  when: not cloud_installed.stat.exists
- name: Set ownership for Nextcloud files
  # Same condition as the extraction above rather than a handler: the
  # files have to be owned correctly before php-fpm is pointed at
  # them, and a recursive chown of the whole tree on every run is
  # needlessly expensive.
  ansible.builtin.file:
    path: "{{ cloud.nextcloud.path }}"
    owner: www-data
    group: www-data
    recurse: true
  when: not cloud_installed.stat.exists
- name: Remove downloaded Nextcloud archive
  ansible.builtin.file:
    path: "/tmp/{{ cloud_archive }}"
    state: absent
- name: Nextcloud PHP-FPM pool
  ansible.builtin.template:
    src: templates/php-fpm-pool.conf.j2
    dest: "/etc/php/{{ cloud_php_version }}/fpm/pool.d/nextcloud.conf"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload PHP-FPM
- name: Nextcloud PHP configuration
  ansible.builtin.template:
    src: templates/php-nextcloud.ini.j2
    dest: "/etc/php/{{ cloud_php_version }}/{{ item }}/conf.d/99-nextcloud.ini"
    owner: root
    group: root
    mode: "0644"
  loop:
    - fpm
    # The CLI SAPI gets the same drop-in: the background job and occ
    # run through it, and APCu is off there by default, so without it
    # the local cache configured below exists for web requests only.
    - cli
  notify:
    - Reload PHP-FPM
- name: Nextcloud trusted domains
  # Same config/*.config.php mechanism as the cache settings below.
  ansible.builtin.template:
    src: templates/domains.config.php.j2
    dest: "{{ cloud.nextcloud.path }}/config/domains.config.php"
    owner: www-data
    group: www-data
    mode: "0640"
    validate: php -l %s
- name: Nextcloud cache configuration
  # A config/*.config.php drop-in rather than config.php, which is
  # written by Nextcloud itself and is not managed here.
  ansible.builtin.template:
    src: templates/cache.config.php.j2
    dest: "{{ cloud.nextcloud.path }}/config/cache.config.php"
    owner: www-data
    group: www-data
    mode: "0640"
    validate: php -l %s
- name: Nextcloud nginx upstream
  ansible.builtin.template:
    src: templates/nextcloud-fpm.conf.j2
    dest: /etc/nginx/conf.d/nextcloud-fpm.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload nginx
- name: Nextcloud nginx location
  ansible.builtin.copy:
    src: files/nextcloud.conf
    dest: /etc/nginx/locations-available/nextcloud.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload nginx
- name: Enable Nextcloud nginx location
  ansible.builtin.file:
    src: /etc/nginx/locations-available/nextcloud.conf
    dest: /etc/nginx/locations-enabled/nextcloud.conf
    state: link
  notify:
    - Reload nginx
- name: Cloud nginx site
  ansible.builtin.template:
    src: templates/cloud.conf.j2
    dest: /etc/nginx/sites-available/cloud.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload nginx
- name: Enable cloud nginx site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/cloud.conf
    dest: /etc/nginx/sites-enabled/cloud.conf
    state: link
  notify:
    - Reload nginx
- name: Remove duplicate Nextcloud background job
  # This role used to create the same job twice: once in www-data's
  # crontab and once in /etc/cron.d. Only the latter is kept.
  ansible.builtin.cron:
    name: "Nextcloud background job"
    user: www-data
    state: absent
- name: Nextcloud cron job
  ansible.builtin.cron:
    name: "Nextcloud cron job"
    user: www-data
    minute: "{{ cloud.nextcloud.cron_minute }}"
    job: "/usr/bin/php -f {{ cloud.nextcloud.path }}/cron.php"
    state: present
    cron_file: nextcloud_cron
- name: Cron job to remove iCCP profiles
  ansible.builtin.cron:
    name: "Remove iCCP profiles from PNG files"
    user: www-data
    minute: "0"
    hour: "3"
    weekday: "0"
    job: >-
      /usr/bin/find {{ cloud.nextcloud.path }} -type f -name '*.png'
      -exec mogrify -strip {} +
    state: present
    cron_file: nextcloud_iccp_cleanup
- name: Validate nginx configuration
  ansible.builtin.command:
    cmd: nginx -t
  changed_when: false
