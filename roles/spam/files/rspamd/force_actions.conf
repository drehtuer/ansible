# Reject on a *failed* authentication check, regardless of the score
# thresholds in actions.conf.
#
# This is deliberately narrow. Only two symbols mean "the sender's own
# published policy says this message is forged":
#
#   R_SPF_FAIL     the domain publishes -all and this host is not
#                  authorised to send for it
#   R_DKIM_REJECT  a DKIM signature is present and does not verify
#
# Everything softer is left alone on purpose, so that mail from the
# many domains which have not deployed SPF or DKIM is still accepted:
#   R_SPF_NA / R_DKIM_NA            no policy published at all
#   R_SPF_SOFTFAIL / R_SPF_NEUTRAL  policy exists but is advisory (~all)
#   *_TEMPFAIL / *_DNSFAIL          our own lookup failed, not their fault
#
# A rejected message is logged twice: by RSpamd with the symbol that
# caused it, and by Postfix as a milter-reject with the text below.
rules {
  SPF_FAILED_REJECT {
    action = "reject";
    expression = "R_SPF_FAIL";
    message = "Message rejected: sender domain SPF policy does not authorise this host";
  }
  DKIM_FAILED_REJECT {
    action = "reject";
    expression = "R_DKIM_REJECT";
    message = "Message rejected: DKIM signature present but invalid";
  }
}
