# Headers RSpamd adds to every message it passes, so the check result
# travels with the mail and is visible in the client.
#
# `spam-header` is the one the delivery-time sieve in roles/imap keys
# on: anything at or above the add_header threshold in actions.conf
# gets `X-Spam: Yes`, and the sieve files those into the Spam mailbox.
# It has to appear in `use` as well as be configured below - listing
# the routine alone does not enable it.
#
# `extended_spam_headers` produces X-Spamd-Result, which lists every
# symbol that fired and its score. That is the header to read when
# asking "why was this classified this way".
extended_spam_headers = true;

use = ["spam-header", "x-spamd-result", "x-spam-level", "x-spam-status", "authentication-results"];

# Without these, mail from the local network - which includes anything
# Postfix hands over from 127.0.0.1, i.e. everything on a single-host
# setup - is passed through with no headers at all.
skip_local = false;
skip_authenticated = false;

routines {
  spam-header {
    header = "X-Spam";
    value = "Yes";
    remove = 1;
  }
}
