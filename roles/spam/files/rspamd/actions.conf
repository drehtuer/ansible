# Score thresholds for RSpamd's actions.
#
# `reject` is deliberately disabled: spam is delivered and filed into
# the user's Spam mailbox by the delivery-time sieve in roles/imap,
# rather than refused at SMTP time. That keeps a false positive
# recoverable by the user instead of bounced back to the sender, and
# it is what makes the Spam mailbox meaningful at all.
#
# Set a number here to reject the worst spam at the door again; the
# rest of the pipeline does not depend on it.
reject = null;
add_header = 6;
greylist = 4;
