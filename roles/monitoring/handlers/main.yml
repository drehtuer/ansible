# Configuration changes reload (both units define ExecReload as a
# SIGHUP); command-line changes restart, since flags are read once at
# startup.
- name: Reload prometheus
  ansible.builtin.systemd_service:
    name: prometheus
    state: reloaded
    enabled: true

- name: Reload alertmanager
  ansible.builtin.systemd_service:
    name: prometheus-alertmanager
    state: reloaded
    enabled: true

- name: Restart prometheus
  ansible.builtin.systemd_service:
    name: prometheus
    state: restarted
    enabled: true

- name: Restart alertmanager
  ansible.builtin.systemd_service:
    name: prometheus-alertmanager
    state: restarted
    enabled: true

- name: Restart node exporter
  ansible.builtin.systemd_service:
    name: prometheus-node-exporter
    state: restarted
    enabled: true
