# Configuration changes reload (both units define ExecReload as a
# SIGHUP); command-line changes restart, since flags are read once at
# startup.
- name: Reload prometheus
  ansible.builtin.systemd_service:
    name: prometheus
    state: reloaded
    enabled: true

- name: Reload alertmanager
  ansible.builtin.systemd_service:
    name: prometheus-alertmanager
    state: reloaded
    enabled: true

- name: Restart prometheus
  ansible.builtin.systemd_service:
    name: prometheus
    state: restarted
    enabled: true

- name: Restart alertmanager
  ansible.builtin.systemd_service:
    name: prometheus-alertmanager
    state: restarted
    enabled: true

- name: Restart node exporter
  ansible.builtin.systemd_service:
    name: prometheus-node-exporter
    state: restarted
    enabled: true

# Grafana reads its provisioning and its admin credential at startup
# only, so a change to either needs the container to come back rather
# than merely to keep running.
- name: Restart grafana
  community.docker.docker_compose_v2:
    project_src: "{{ monitoring.grafana.compose_dir }}"
    state: restarted

- name: Reload nginx
  ansible.builtin.systemd_service:
    name: nginx
    state: reloaded
    enabled: true
