monitoring:  # noqa: var-naming[no-role-prefix] - see doc/STATUS.adoc
  # Phase 1: collection and mail alerting only. Nothing here is
  # reachable from off-host - every listener is on loopback, and
  # roles/firewall opens no port for any of them. The status.<domain>
  # vhost and Grafana are phase 2; see doc/TODO.adoc.
  #
  # These defaults are complete and correct for carcosa, so there is
  # deliberately no inventories/group_vars/all/monitoring.yml. Adding
  # one to tune a threshold means repeating EVERY key below: an
  # inventory dict replaces the role default rather than merging into
  # it. See doc/STATUS.adoc.
  prometheus:
    # The packaged binary listens on 0.0.0.0:9090 - read out of the
    # .deb rather than assumed - so this override is the only thing
    # keeping it off the public addresses until nginx is in front of
    # it. Same stance roles/database takes with MariaDB and Redis:
    # the binding is owned here rather than inherited from the
    # package, where an upgrade could change it with nothing to
    # notice.
    listen_address: 127.0.0.1
    port: 9090
    scrape_interval: 15s
    evaluation_interval: 15s
    # Prometheus keeps 15 days if neither retention flag is given.
    # Time bounds how far back a question can be asked; size bounds
    # what a runaway series count can cost the same disk that holds
    # 104 GB of Nextcloud data. Whichever is reached first wins.
    retention_time: 90d
    retention_size: 8GB
    # A dpkg conffile the role takes over. Nothing load-bearing is
    # lost by replacing it - the packaged file only scrapes
    # Prometheus itself - which is what makes this safe where
    # replacing Redis's config file was not.
    config_file: /etc/prometheus/prometheus.yml
    # Owned entirely by this role, unlike the file above.
    rules_dir: /etc/prometheus/rules
  alertmanager:
    listen_address: 127.0.0.1
    port: 9093
    config_file: /etc/prometheus/alertmanager.yml
    mail:
      # Delivered through the Postfix this repo already configures,
      # over loopback, so there is no credential and no TLS to
      # arrange. Note the circularity that buys: an alert about
      # Postfix cannot be mailed by Postfix. The Watchdog alert is
      # the only answer available on a single host.
      smarthost: 127.0.0.1:25
      from: "monitoring@{{ domain }}"
      # `root` already forwards to the administrator through
      # mail.aliases, so this needs no new alias and leaves one place
      # to change where alerts land.
      to: "root@{{ domain }}"
      # Loopback to a Postfix that offers STARTTLS opportunistically;
      # requiring it here would fail the send for no gain in
      # confidentiality, the traffic never leaving the host.
      require_tls: false
    # Wait before the first mail for a new alert group, before a
    # newly firing alert joins an existing group's mail, and before
    # an alert that is still firing is mailed again.
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 24h
    resolve_timeout: 5m
    # The always-firing Watchdog alert is mailed on this interval and
    # its *absence* is the signal. It is the only proof available on
    # one host that scraping, rule evaluation, routing and the mail
    # path are all still working - the same reasoning as the nsd
    # re-signing timer, where scheduling a job proves it started and
    # nothing more.
    watchdog_interval: 24h
  node_exporter:
    listen_address: 127.0.0.1
    port: 9100
    # Enabled explicitly rather than relied upon: the systemd
    # collector is off by default in node_exporter 1.7 (Ubuntu 24.04)
    # and on by default in 1.10 (26.04), and passing the flag is a
    # no-op where it is already on. It is what turns "no unit is in
    # the failed state" into a continuously checked invariant instead
    # of something someone remembers to run - see the
    # unbound-resolvconf story in doc/STATUS.adoc.
    collectors:
      - systemd
    # Where a script may drop a .prom file for anything that has no
    # exporter of its own - NSD serials, DNSSEC signature expiry,
    # fail2ban jail counts. Nothing writes here in phase 1; the
    # directory is created so the collector does not log an error on
    # every scrape.
    textfile_dir: /var/lib/prometheus/node-exporter
  alerts:
    disk:
      # Percentage of a filesystem still free.
      warning_percent: 10
      critical_percent: 5
      # A falling trend is more useful than any fixed line because it
      # answers "when", and / grows here with every Nextcloud upload.
      # Fit over predict_window, extrapolate predict_horizon_days
      # ahead, alert if that lands below zero. Restricted to
      # filesystems already under predict_below_percent free, so a
      # half-empty disk having a busy afternoon does not qualify.
      predict_window: 6h
      predict_horizon_days: 4
      predict_below_percent: 30
    inodes:
      # A Maildir is one file per message and Nextcloud's data
      # directory is millions of small ones, so this host can
      # plausibly exhaust inodes with space to spare - a failure that
      # presents as "disk full" while df shows room.
      warning_percent: 10
    memory:
      available_percent: 10
    load:
      # node_load15 divided by the number of CPUs.
      per_cpu: 2.0
    clock:
      # roles/time manages ntpsec, so drift means it stopped working
      # rather than that it was never set up.
      max_offset_seconds: 0.05
    network:
      # The interface facing the internet. Same fact and the same
      # reasoning as firewall.docker.wan_interface, and deliberately
      # without a fallback for the same reason: a wrong name makes
      # the rule match nothing, silently.
      interface: "{{ ansible_facts['default_ipv4'].interface }}"
      # Sustained throughput in megabits per second, averaged over
      # `window`. These are placeholders until this host has a
      # baseline to set them from - the right number cannot be known
      # in advance, so treat the first weeks as warn-only and tune.
      # Egress is the interesting direction: an abused relay, a
      # compromised account or a bulk copy of the data directory all
      # look like sustained outbound traffic.
      egress_mbit: 500
      ingress_mbit: 800
      window: 15m
