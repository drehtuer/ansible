- name: Install monitoring
  # Alertmanager and node_exporter come from the archive on both 24.04
  # and 26.04. node_exporter in particular is a poor container citizen:
  # it would need the host's PID and network namespaces and bind mounts
  # of /proc, /sys and /, giving away every bit of isolation a
  # container exists for. amtool comes with the alertmanager package.
  #
  # The server itself does not - see below.
  ansible.builtin.apt:
    install_recommends: false
    name:
      - prometheus-alertmanager
      - prometheus-node-exporter

- name: Remove the packaged prometheus server
  # The archive's Prometheus cannot serve the modern web UI, and says
  # so in as many words. 26.04's package ships a stub at
  # /usr/share/prometheus/web/no-ui/index.html reading "This Debian
  # package of Prometheus does not include the modern React web UI,
  # due to the complexity of packaging it without violating Debian
  # policy", plus an install-ui.sh that downloads the assets from
  # GitHub after the fact. 24.04's package - 2.45.3, what carcosa ran
  # until 2026-08-20 - ships neither: only the classic UI, which
  # upstream removed in v2.34.0 and Debian carries "for a limited
  # time" and warns will be dropped.
  #
  # So the choice was never package-or-tarball in the abstract: it was
  # a 2.45 server with an unmaintained UI, or the current release with
  # the interface upstream actually ships. The tarball is pinned and
  # checksummed, the same stance roles/cloud takes with Nextcloud, and
  # it carries a promtool of exactly the server's version - which is
  # what the removed 24.04/26.04 promtool-package dance was about.
  #
  # The trade is real and worth stating: no distro security updates
  # for this one binary. Bumping monitoring.prometheus.version is the
  # whole upgrade, and the release feed is the thing to watch.
  ansible.builtin.apt:
    name: prometheus
    state: absent
    # Deliberately not purged. /etc/prometheus is this role's to own,
    # and its conffiles survive a remove; a purge would take the
    # directory with them.
    purge: false

- name: Ensure the prometheus account exists
  # Created by the alertmanager and node_exporter packages as well, so
  # on this host it already exists - but the server must not depend on
  # a side effect of a package it no longer installs.
  ansible.builtin.group:
    name: prometheus
    system: true

- name: Ensure the prometheus user exists
  ansible.builtin.user:
    name: prometheus
    group: prometheus
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/prometheus
    create_home: false

- name: Note the architecture prometheus ships a build for
  ansible.builtin.set_fact:
    monitoring_arch: >-
      {{ monitoring_arch_map[ansible_facts['architecture']] }}

- name: Note where this release unpacks to
  ansible.builtin.set_fact:
    monitoring_release_dir: >-
      {{ monitoring.prometheus.install_dir }}/prometheus-{{
      monitoring.prometheus.version }}.linux-{{ monitoring_arch }}

- name: Check whether this release is already unpacked
  # Without this the tarball is fetched and deleted again on every
  # run, which reports two changes for a converged host - and an
  # upgrade is then indistinguishable from a no-op in the output.
  ansible.builtin.stat:
    path: "{{ monitoring_release_dir }}/prometheus"
  register: monitoring_prometheus_release

- name: Download the prometheus release
  ansible.builtin.get_url:
    url: >-
      https://github.com/prometheus/prometheus/releases/download/v{{
      monitoring.prometheus.version }}/prometheus-{{
      monitoring.prometheus.version }}.linux-{{ monitoring_arch }}.tar.gz
    dest: /tmp/prometheus-{{ monitoring.prometheus.version }}.tar.gz
    checksum: >-
      sha256:{{ monitoring.prometheus.checksums[monitoring_arch] }}
    owner: root
    group: root
    mode: "0644"
  when: not monitoring_prometheus_release.stat.exists

- name: Unpack the prometheus release
  ansible.builtin.unarchive:
    src: /tmp/prometheus-{{ monitoring.prometheus.version }}.tar.gz
    dest: "{{ monitoring.prometheus.install_dir }}"
    remote_src: true
    owner: root
    group: root
    creates: "{{ monitoring_release_dir }}/prometheus"
  when: not monitoring_prometheus_release.stat.exists

- name: Remove the downloaded archive
  ansible.builtin.file:
    path: /tmp/prometheus-{{ monitoring.prometheus.version }}.tar.gz
    state: absent
  when: not monitoring_prometheus_release.stat.exists

- name: Point the stable path at this release
  # The unit and the promtool symlink below name this path rather than
  # the versioned directory, so an upgrade is a relink and a restart -
  # and the previous release stays on disk to go back to.
  ansible.builtin.file:
    src: "{{ monitoring_release_dir }}"
    path: "{{ monitoring.prometheus.install_dir }}/prometheus"
    state: link
  notify:
    - Restart prometheus

- name: Put promtool on PATH
  # So that the `validate` steps below can call it by name, as they
  # did when it was packaged, and so that it is there for anyone
  # checking a rule file by hand.
  ansible.builtin.file:
    src: "{{ monitoring.prometheus.install_dir }}/prometheus/promtool"
    path: /usr/local/bin/promtool
    state: link

- name: Create the prometheus data directory
  # Debian patched the packaged binary to default to this path; the
  # upstream one has to be told, and is, in the unit. Same path, so
  # the history collected under the package is kept.
  ansible.builtin.file:
    path: "{{ monitoring.prometheus.data_dir }}"
    state: directory
    owner: prometheus
    group: prometheus
    mode: "0750"

- name: Configure the prometheus service
  ansible.builtin.template:
    src: templates/prometheus.service.j2
    dest: /etc/systemd/system/prometheus.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart prometheus

- name: Remove the EnvironmentFile the packaged unit used
  # Flags live in the unit now. Left behind it would read like the
  # place to change them, which is worse than its absence.
  ansible.builtin.file:
    path: /etc/default/prometheus
    state: absent

- name: Create the rules directory
  ansible.builtin.file:
    path: "{{ monitoring.prometheus.rules_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create the textfile collector directory
  # Nothing writes here in phase 1. It exists so the collector does
  # not log a missing-directory error on every scrape.
  ansible.builtin.file:
    path: "{{ monitoring.node_exporter.textfile_dir }}"
    state: directory
    owner: root
    group: prometheus
    mode: "0755"

- name: Deploy the alert rules
  # Before the Prometheus configuration below, and that order is
  # load-bearing: `promtool check config` resolves the rule_files
  # glob, so validating the configuration first would check it
  # against rules that are not on disk yet.
  ansible.builtin.template:
    src: "templates/rules/{{ item }}.rules.yml.j2"
    dest: "{{ monitoring.prometheus.rules_dir }}/{{ item }}.rules.yml"
    owner: root
    group: root
    mode: "0644"
    validate: promtool check rules %s
  loop:
    - node
    - monitoring
  notify:
    - Reload prometheus

- name: Configure prometheus
  ansible.builtin.template:
    src: templates/prometheus.yml.j2
    dest: "{{ monitoring.prometheus.config_file }}"
    owner: root
    group: root
    mode: "0644"
    validate: promtool check config %s
  notify:
    - Reload prometheus

- name: Configure alertmanager
  ansible.builtin.template:
    src: templates/alertmanager.yml.j2
    dest: "{{ monitoring.alertmanager.config_file }}"
    owner: root
    group: root
    mode: "0644"
    validate: amtool check-config %s
  notify:
    - Reload alertmanager

# The three files below are what the packaged units read their
# command line from, so a change to any of them needs a restart
# rather than a reload - the flags are only read at startup.
- name: Configure the alertmanager service arguments
  ansible.builtin.template:
    src: templates/default/prometheus-alertmanager.j2
    dest: /etc/default/prometheus-alertmanager
    owner: root
    group: root
    mode: "0644"
  notify:
    - Restart alertmanager

- name: Configure the node exporter service arguments
  ansible.builtin.template:
    src: templates/default/prometheus-node-exporter.j2
    dest: /etc/default/prometheus-node-exporter
    owner: root
    group: root
    mode: "0644"
  notify:
    - Restart node exporter

- name: Enable the monitoring services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - prometheus
    - prometheus-alertmanager
    - prometheus-node-exporter

- name: Configure the grafana frontend
  # Needs roles/docker (the engine and Compose v2) and roles/http
  # (nginx plus a certificate covering the subdomain). Neither is
  # asserted here - the repo has no umbrella playbook yet, so the
  # ordering is recorded in doc/STATUS.adoc with the other
  # constraints.
  #
  # Tagged as a whole so the molecule scenario can skip it, the same
  # device roles/system uses for setting the hostname: this half needs
  # a Docker daemon and a running nginx, and the test container has
  # neither. The real playbooks never pass --skip-tags, so it runs
  # normally on a host.
  tags:
    - grafana
  block:
    - name: Create grafana directories
      vars:
        monitoring_prov: "{{ monitoring.grafana.compose_dir }}/provisioning"
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner | default('root') }}"
        group: root
        mode: "{{ item.mode }}"
      loop:
        - path: "{{ monitoring.grafana.compose_dir }}"
          mode: "0755"
        - path: "{{ monitoring.grafana.compose_dir }}/provisioning"
          mode: "0755"
        # All six, not only the two this repo puts files in. The mount
        # replaces Grafana's whole provisioning tree, and it logs an
        # error at startup for every directory of its own that is then
        # missing - which leaves a permanent error in the log of the
        # one service whose job is to report problems.
        - path: "{{ monitoring_prov }}/datasources"
          mode: "0755"
        - path: "{{ monitoring_prov }}/dashboards"
          mode: "0755"
        - path: "{{ monitoring_prov }}/alerting"
          mode: "0755"
        - path: "{{ monitoring_prov }}/plugins"
          mode: "0755"
        - path: "{{ monitoring_prov }}/notifiers"
          mode: "0755"
        - path: "{{ monitoring_prov }}/access-control"
          mode: "0755"
        - path: "{{ monitoring.grafana.compose_dir }}/dashboards"
          mode: "0755"
        # Grafana's own database, written by the container's uid. Not
        # world-readable: it holds sessions for an interface that can read
        # every metric this host collects.
        - path: "{{ monitoring.grafana.data_dir }}"
          mode: "0750"
          owner: "{{ monitoring.grafana.uid }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Configure the grafana admin credential
      # Its own file rather than an environment block in compose.yml, so
      # that a --diff from `invoke check-drift` cannot print it. Same
      # reasoning as the nsd role's separate tsig.conf.
      ansible.builtin.template:
        src: templates/grafana/admin.env.j2
        dest: "{{ monitoring.grafana.compose_dir }}/admin.env"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      notify:
        - Restart grafana

    - name: Provision the grafana datasource
      vars:
        monitoring_prov: "{{ monitoring.grafana.compose_dir }}/provisioning"
      ansible.builtin.template:
        src: templates/grafana/provisioning/datasources/prometheus.yml.j2
        dest: "{{ monitoring_prov }}/datasources/prometheus.yml"
        owner: root
        group: root
        mode: "0644"
      notify:
        - Restart grafana

    - name: Provision the grafana dashboard provider
      vars:
        monitoring_prov: "{{ monitoring.grafana.compose_dir }}/provisioning"
      ansible.builtin.template:
        src: templates/grafana/provisioning/dashboards/dashboards.yml.j2
        dest: "{{ monitoring_prov }}/dashboards/dashboards.yml"
        owner: root
        group: root
        mode: "0644"
      notify:
        - Restart grafana

    - name: Deploy the grafana dashboards
      ansible.builtin.template:
        src: "templates/grafana/dashboards/{{ item }}.json.j2"
        dest: "{{ monitoring.grafana.compose_dir }}/dashboards/{{ item }}.json"
        owner: root
        group: root
        mode: "0644"
        # Grafana logs a malformed dashboard and carries on without it, so
        # the failure is a missing page rather than an error. Same stance
        # as promtool on the alert rules.
        validate: python3 -m json.tool %s /dev/null
      loop:
        - host
      notify:
        - Restart grafana

    - name: Configure the grafana compose stack
      ansible.builtin.template:
        src: templates/grafana/compose.yml.j2
        dest: "{{ monitoring.grafana.compose_dir }}/compose.yml"
        owner: root
        group: root
        mode: "0644"

    - name: Start grafana
      # docker_compose_v2 rather than docker_container, as roles/fail2ban_ui
      # and roles/talk do: it drives the `docker compose` CLI the docker
      # role installs, so nothing needs the Python docker SDK on the
      # target and the compose file stays the readable description.
      community.docker.docker_compose_v2:
        project_src: "{{ monitoring.grafana.compose_dir }}"
        state: present
        # `missing`, not `always`: the digest already decides which image
        # this is, so a converged host has no reason to reach Docker Hub.
        pull: missing

    - name: Remove the superseded status vhost
      # This name used to be a static placeholder declared in http.sites.
      # The http role renders and enables that list but never removes an
      # entry dropped from it, so without this the old vhost stays on disk
      # and claims the same server_name as the one below. nginx resolves a
      # duplicate by keeping whichever loaded first and warning, which
      # `nginx -t` reports as a success.
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/nginx/sites-enabled/status.conf
        - /etc/nginx/sites-available/status.conf
      notify:
        - Reload nginx

    - name: Add htaccess for the monitoring frontend
      # Vault-encrypted and decrypted at deploy time, the same pattern as
      # the spam and fail2ban_ui roles. `copy` compares content, so
      # replacing the credential is picked up without a separate checksum.
      ansible.builtin.copy:
        src: files/nginx/monitoring.htpasswd.aes256
        dest: /etc/nginx/sites-available/monitoring.htpasswd
        decrypt: true
        owner: root
        group: root
        mode: "0644"

    - name: Enable the monitoring htpasswd in nginx
      ansible.builtin.file:
        src: /etc/nginx/sites-available/monitoring.htpasswd
        dest: /etc/nginx/sites-enabled/monitoring.htpasswd
        state: link
      notify:
        - Reload nginx

    - name: Add the monitoring vhost in nginx
      ansible.builtin.template:
        src: templates/nginx/monitoring.conf.j2
        dest: /etc/nginx/sites-available/monitoring.conf
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload nginx

    - name: Enable the monitoring site in nginx
      ansible.builtin.file:
        src: /etc/nginx/sites-available/monitoring.conf
        dest: /etc/nginx/sites-enabled/monitoring.conf
        state: link
      notify:
        - Reload nginx

    - name: Validate nginx configuration
      # Same stance as the http, cloud and fail2ban_ui roles: reloading a
      # broken configuration leaves the old one serving, so the run would
      # go green with this vhost not actually loaded.
      ansible.builtin.command:
        cmd: nginx -t
      changed_when: false
