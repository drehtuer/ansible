# Molecule scenario for the `monitoring` role. Run with
# `invoke test-molecule --role=monitoring`, or `molecule test` from
# roles/monitoring.
#
# This role is a container-friendly one, unlike `fail2ban_ui`: it is
# apt packages and systemd units with no Docker, no netfilter and no
# certificate involved. What the scenario proves is that the three
# services start under the arguments this role writes and that a
# second pass changes nothing - which covers the `validate` steps
# too, since promtool and amtool run on the way in.
#
# The image is an init-enabled one: almost every role here uses
# `systemd_service`, which does nothing useful in a container that is
# not running systemd as PID 1. That is why a plain ubuntu:24.04
# image will not do.
driver:
  name: docker
platforms:
  - name: ansible-test-monitoring
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  name: ansible
  env:
    # Molecule does not add the repository's roles/ directory to
    # the roles path, so the role under test cannot be resolved by
    # name and the run fails at the syntax stage, before any
    # container is created. MOLECULE_PROJECT_DIRECTORY is
    # roles/<role>, so its parent is the roles directory.
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/.."
verifier:
  name: ansible
