# The test images ship with an empty apt cache, so a role installing
# a package that is not already present cannot resolve it. On a real
# host the `apt` role refreshes the cache before the other roles run;
# molecule converges a role on its own, so it has to happen here.
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install what verify.yml needs
      # `ss`, for the listener assertions. A test dependency rather
      # than a role one - the role itself needs neither, and adding it
      # to the role would install it on a real host for no reason.
      ansible.builtin.apt:
        install_recommends: false
        name: iproute2
