- name: Install IMAP (dovecot)
  ansible.builtin.apt:
    install_recommends: false
    name:
      - dovecot-core
      - dovecot-imapd
      - dovecot-lmtpd
      - dovecot-sieve
      - curl
  notify:
    - Restart dovecot
- name: Create sieve-pipe directory
  ansible.builtin.file:
    path: /etc/dovecot/sieve-pipe
    state: directory
    owner: root
    group: root
    mode: '0755'
- name: Create sieve directory
  ansible.builtin.file:
    path: /etc/dovecot/sieve
    state: directory
    owner: root
    group: root
    mode: '0755'
- name: Copy rspam learn ham script
  ansible.builtin.template:
    src: templates/rspamd-learn-ham.sh.j2
    dest: /etc/dovecot/sieve-pipe/rspamd-learn-ham.sh
    owner: root
    group: dovecot
    # Embeds the controller password, so not world-readable. Dovecot
    # runs sieve pipes as the mail user, which needs execute only.
    mode: '0750'
- name: Copy rspam learn spam script
  ansible.builtin.template:
    src: templates/rspamd-learn-spam.sh.j2
    dest: /etc/dovecot/sieve-pipe/rspamd-learn-spam.sh
    owner: root
    group: dovecot
    # Embeds the controller password, so not world-readable. Dovecot
    # runs sieve pipes as the mail user, which needs execute only.
    mode: '0750'
- name: Copy learn-ham sieve script
  ansible.builtin.copy:
    src: files/learn-ham.sieve
    dest: /etc/dovecot/sieve/learn-ham.sieve
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload dovecot
- name: Copy learn-spam sieve script
  ansible.builtin.copy:
    src: files/learn-spam.sieve
    dest: /etc/dovecot/sieve/learn-spam.sieve
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload dovecot
- name: Copy spam-to-folder sieve script
  ansible.builtin.copy:
    src: files/spam-to-folder.sieve
    dest: /etc/dovecot/sieve/spam-to-folder.sieve
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload dovecot
- name: Compile sieve scripts
  # A task rather than a handler, and unconditional. As handlers these
  # only ran when the script file itself changed, so a first compile
  # that failed - or any change made elsewhere, such as loading the
  # imapsieve plugin - left no .svbin behind at all. Dovecot then tries
  # to compile at delivery/IMAP time as the *user*, cannot write into
  # /etc/dovecot/sieve, and silently does nothing: the training scripts
  # never run and no error reaches the playbook.
  #
  # Compiling is deterministic and cheap, so it is not reported as a
  # change; the copy tasks above are what notify the reload.
  ansible.builtin.command:
    cmd: "sievec /etc/dovecot/sieve/{{ item }}.sieve"
  changed_when: false
  loop:
    - learn-ham
    - learn-spam
    - spam-to-folder

- name: Configure dovecot
  ansible.builtin.template:
    src: templates/dovecot.conf.j2
    dest: /etc/dovecot/dovecot.conf
    owner: root
    group: root
    mode: '0644'
  notify:
    - Reload dovecot
