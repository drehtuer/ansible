argument_specs:
  main:
    short_description: Authoritative DNS with NSD
    description:
      - Serves the declared zones authoritatively on this host's public
        addresses and offers AXFR to the configured secondaries only.
        Runs alongside the unbound resolver from the `dns` role, which
        stays bound to loopback.
      - NSD is authoritative-only and cannot recurse, so this cannot
        become an open resolver.
    options:
      nsd:
        type: dict
        required: true
        description: Authoritative DNS settings.
        options:
          listen:
            type: list
            elements: str
            required: true
            description:
              - Addresses NSD answers on. Public only; loopback belongs
                to the unbound resolver. Must not be empty, or NSD
                binds every interface.
          secondaries:
            type: list
            elements: str
            required: true
            description:
              - Addresses allowed to AXFR the zones and notified on
                change. Everything else is refused.
          notify:
            type: list
            elements: str
            required: true
            description:
              - Addresses told when the zone changes. IPv4 only for
                Hetzner, which refuses a NOTIFY sent from this host's
                IPv6 address whatever key signs it.
          rrl:
            type: dict
            required: true
            description: Response rate limiting.
            options:
              size:
                type: int
                required: true
                description: Size of the rate limit table.
              ratelimit:
                type: int
                required: true
                description: Responses per second per bucket.
              whitelist_ratelimit:
                type: int
                required: true
                description: Rate limit for whitelisted sources.
          propagation:
            type: dict
            required: true
            description:
              - Post-deploy check that every nameserver in a zone's NS
                records is serving the serial this host now has.
            options:
              check:
                type: bool
                required: true
                description:
                  - Whether to run the check at all. Turning it off
                    means a transfer that silently stopped working is
                    not noticed here.
              retries:
                type: int
                required: true
                description: Attempts before a nameserver is called stale.
              delay:
                type: int
                required: true
                description: Seconds between those attempts.
          dnssec:
            type: dict
            required: true
            description:
              - Zone signing. Enabling it signs and serves the zones;
                nothing validates until a DS record for the KSK is
                published in the parent zone at the registrar, which is
                deliberately a separate manual step.
            options:
              enabled:
                type: bool
                required: true
                description: Whether to sign the zones at all.
              key_dir:
                type: str
                required: true
                description: Where the deployed KSK/ZSK pairs live.
              signature_validity:
                type: int
                required: true
                description:
                  - Seconds the generated signatures stay valid. Must
                    comfortably exceed the re-sign interval below;
                    expired signatures make a zone bogus, not unsigned.
              resign:
                type: dict
                required: true
                description: Schedule for the re-signing cron job.
                options:
                  weekday:
                    type: str
                    required: true
                    description: Cron weekday field.
                  hour:
                    type: str
                    required: true
                    description: Cron hour field.
                  minute:
                    type: str
                    required: true
                    description: Cron minute field.
          zones:
            type: list
            elements: dict
            required: true
            description: Zones served authoritatively.
            options:
              name:
                type: str
                required: true
                description: Zone name, without a trailing dot.
              ttl:
                type: int
                required: true
                description: Default TTL.
              serial:
                type: int
                required: true
                description:
                  - Zone serial. Must be increased whenever the records
                    change, or secondaries keep their old copy.
              tsig:
                type: dict
                required: true
                description:
                  - Shared secret authenticating this one zone's
                    transfers to the secondaries (TSIG). Declared per
                    zone rather than per server, because Hetzner
                    derives the key name from the zone and this host's
                    address - so two zones cannot share a name anyway,
                    and a rotated key costs one zone instead of all of
                    them. An empty secret disables it and falls back to
                    source-address restriction alone.
                options:
                  name:
                    type: str
                    required: true
                    description:
                      - Key name. Both ends must agree on it; it
                        travels in the clear as part of the transfer.
                        Hetzner derives it as "<zone>.<primary-ip>."
                        and offers no way to choose it.
                  algorithm:
                    type: str
                    required: true
                    choices:
                      - hmac-md5
                      - hmac-sha1
                      - hmac-sha256
                    description:
                      - HMAC algorithm. Hetzner accepts these three;
                        only hmac-sha256 is unbroken.
                  secret:
                    type: str
                    required: true
                    description:
                      - Base64 shared secret, or empty to disable TSIG
                        for this zone.
              soa:
                type: dict
                required: true
                description: SOA fields.
                options:
                  primary:
                    type: str
                    required: true
                    description: SOA MNAME, with trailing dot.
                  contact:
                    type: str
                    required: true
                    description: SOA RNAME, with trailing dot.
                  refresh:
                    type: int
                    required: true
                    description: Refresh interval.
                  retry:
                    type: int
                    required: true
                    description: Retry interval.
                  expire:
                    type: int
                    required: true
                    description: Expiry.
                  minimum:
                    type: int
                    required: true
                    description: Negative caching TTL.
              nameservers:
                type: list
                elements: str
                required: true
                description: NS records, with trailing dots.
              records:
                type: list
                elements: dict
                required: true
                description: The zone's resource records.
                options:
                  name:
                    type: str
                    required: true
                    description: Owner name, or @ for the apex.
                  type:
                    type: str
                    required: true
                    description: Record type.
                  value:
                    type: str
                    required: true
                    description: Record data.
