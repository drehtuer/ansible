nsd:  # noqa: var-naming[no-role-prefix] - see doc/STATUS.adoc
  # Addresses to answer on. Public only - the recursive resolver owns
  # loopback. Empty by default so the role cannot accidentally bind
  # every interface on a host that has not declared its addresses.
  listen: []
  # Addresses permitted to pull the zones by AXFR: Hetzner's three
  # secondary nameservers, both families, since a transfer may reach
  # this host over either. The same three serve every zone, so this is
  # one list rather than one per zone.
  # https://docs.hetzner.com/de/networking/dns/overview
  secondaries:
    - 213.239.242.238      # ns1.first-ns.de
    - 2a01:4f8:0:a101::a:1
    - 213.133.100.103      # robotns2.second-ns.de
    - 2a01:4f8:0:1::5ddc:2
    - 193.47.99.3          # robotns3.second-ns.com
    - 2001:67c:192c::add:a3
  # Addresses told when a zone changes, so they fetch it promptly
  # instead of waiting out the SOA refresh interval.
  #
  # The same three servers, but their IPv4 addresses only, and that is
  # deliberate. Hetzner answers a NOTIFY arriving from this host's IPv6
  # address with REFUSED no matter which key signs it - established by
  # probing each candidate key against each address: a key they do not
  # know is answered NOTAUTH, whereas the working key over IPv6 is
  # answered REFUSED, so the key verifies and the notify is turned down
  # on policy. Notifying over IPv6 as well therefore achieved nothing
  # except 18 error lines in the log per zone change, which is how a
  # log stops being worth reading.
  #
  # Nothing is lost by leaving them out: these are the same three
  # servers, so notifying their IPv4 addresses tells every secondary
  # there is. If Hetzner ever accepts it, adding the addresses back
  # here is the whole change.
  notify:
    - 213.239.242.238      # ns1.first-ns.de
    - 213.133.100.103      # robotns2.second-ns.de
    - 193.47.99.3          # robotns3.second-ns.com
  # Response rate limiting, against reflection abuse. NSD cannot be an
  # open resolver, but a spoofed source address can still make it send
  # a reply to a victim; this caps how often the same answer goes to
  # the same network. The defaults NSD ships are sane and these match
  # them closely.
  rrl:
    size: 1000000
    ratelimit: 200
    whitelist_ratelimit: 2000
  # After a zone changes, the role asks every nameserver named in that
  # zone's NS records whether it is serving the new serial yet, and
  # fails the run if one never catches up. A stale secondary is
  # otherwise completely silent: this host answers correctly, so every
  # check made *here* passes while the world keeps the old zone.
  #
  # Retried rather than asked once, because a transfer takes a moment
  # even when the NOTIFY arrives immediately. Ten attempts six seconds
  # apart is a minute, which is far longer than a working transfer
  # needs and short enough not to hide a broken one.
  propagation:
    check: true
    retries: 10
    delay: 6
  # No zones by default: the role is a no-op until a host declares
  # what it is authoritative for.
  #
  # Each zone carries its own `tsig` block - the shared secret
  # authenticating *its* transfers, so a secondary can verify the zone
  # it received really came from this host and was not altered in
  # transit (TSIG, RFC 8945). One key per zone rather than one key for
  # the server, for two reasons:
  #
  #   * Hetzner leaves no choice. Their console takes only the
  #     algorithm and the secret and derives the key name itself as
  #     "<zone>.<primary-ip>.", so two zones cannot share a name even
  #     if they shared a secret.
  #   * A compromised or rotated key then costs one zone, not all of
  #     them. Rotating means changing the secret here and in Hetzner's
  #     console for that zone alone.
  #
  # An empty secret disables TSIG for that zone and falls back to
  # unauthenticated transfers restricted by source address alone, which
  # is what Hetzner's own example configuration shows.
  #
  # hmac-sha256 because it is the strongest of the three algorithms
  # Hetzner accepts - the other two are hmac-md5 and hmac-sha1, both
  # long broken.
  #
  # TSIG is *not* DNSSEC. TSIG authenticates the transfer between these
  # two servers and is not stored in the zone, whereas DNSSEC signs the
  # zone data itself so that any validating resolver can check an
  # answer. Neither substitutes for the other.
  zones: []
