nsd:  # noqa: var-naming[no-role-prefix] - see doc/STATUS.adoc
  # Addresses to answer on. Public only - the recursive resolver owns
  # loopback. Empty by default so the role cannot accidentally bind
  # every interface on a host that has not declared its addresses.
  listen: []
  # Addresses permitted to pull the zone by AXFR and sent NOTIFY when
  # it changes: Hetzner's three secondary nameservers, v4 and v6.
  # https://docs.hetzner.com/de/networking/dns/overview
  secondaries:
    - 213.239.242.238      # ns1.first-ns.de
    - 2a01:4f8:0:a101::a:1
    - 213.133.100.103      # robotns2.second-ns.de
    - 2a01:4f8:0:1::5ddc:2
    - 193.47.99.3          # robotns3.second-ns.com
    - 2001:67c:192c::add:a3
  # Shared secret authenticating the zone transfer, so a secondary can
  # verify the zone it received really came from this host and was not
  # altered in transit (TSIG, RFC 8945). This is *not* DNSSEC: TSIG
  # authenticates the transfer between these two servers and is not
  # stored in the zone, whereas DNSSEC signs the zone data itself so
  # that any validating resolver can check an answer. Neither
  # substitutes for the other.
  #
  # An empty secret disables it and falls back to unauthenticated
  # transfers restricted by source address alone, which is what
  # Hetzner's own example configuration shows. Left empty here so the
  # role does not require a secret from a host that has no zones.
  #
  # hmac-sha256 because it is the strongest of the three algorithms
  # Hetzner accepts - the other two are hmac-md5 and hmac-sha1, both
  # long broken.
  tsig:
    name: transfer
    algorithm: hmac-sha256
    secret: ""
  # Response rate limiting, against reflection abuse. NSD cannot be an
  # open resolver, but a spoofed source address can still make it send
  # a reply to a victim; this caps how often the same answer goes to
  # the same network. The defaults NSD ships are sane and these match
  # them closely.
  rrl:
    size: 1000000
    ratelimit: 200
    whitelist_ratelimit: 2000
  # No zones by default: the role is a no-op until a host declares
  # what it is authoritative for.
  zones: []
