argument_specs:
  main:
    short_description: Install Docker Engine, Buildx and Compose
    description:
      - Installs Docker and writes /etc/docker/daemon.json. Access to
        the docker group is granted through the `users` role, not
        here.
    options:
      docker:
        type: dict
        required: true
        description: Docker settings.
        options:
          daemon:
            type: dict
            required: true
            description: Contents of /etc/docker/daemon.json.
            options:
              log_driver:
                type: str
                required: true
                description: Default logging driver for containers.
              log_opts:
                type: dict
                required: true
                description:
                  - Options for the logging driver. Set max-size and
                    max-file for json-file, which otherwise never
                    rotates.
              live_restore:
                type: bool
                required: true
                description:
                  - Keep containers running while the daemon restarts.
