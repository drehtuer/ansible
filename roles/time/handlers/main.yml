- name: Restart ntpd
  ansible.builtin.systemd_service:
    # The Debian/Ubuntu ntpsec package ships ntpsec.service.
    name: ntpsec
    daemon_reload: true
    state: restarted
    enabled: true
- name: Set HW clock
  # Set HW clock from system clock
  ansible.builtin.command:
    cmd: hwclock --systohc
  changed_when: true
- name: Restart crond
  ansible.builtin.systemd_service:
    # Debian/Ubuntu call the cron service `cron`; `crond` is the
    # Red Hat name and does not exist here.
    name: cron
    state: restarted
