- name: Refuse to run without the three shared secrets
  # All three, and none interchangeable. Starting the backend with an
  # empty secret would leave TURN relaying for anyone who asks and the
  # signaling server trusting any caller.
  ansible.builtin.assert:
    that:
      - talk.secrets.turn | length > 0
      - talk.secrets.signaling | length > 0
      - talk.secrets.internal | length > 0
    fail_msg: >-
      talk.secrets.turn, .signaling and .internal must all be set
      (vault-encrypted) before this role can run.

- name: Create the compose directory
  ansible.builtin.file:
    path: "{{ talk.compose_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Talk compose file
  ansible.builtin.template:
    src: templates/compose.yml.j2
    dest: "{{ talk.compose_dir }}/compose.yml"
    owner: root
    group: root
    # Carries all three secrets, so not world-readable.
    mode: "0600"
  notify:
    - Restart talk

- name: Start the Talk backend
  community.docker.docker_compose_v2:
    project_src: "{{ talk.compose_dir }}"
    state: present
    pull: missing

- name: Talk nginx site
  ansible.builtin.template:
    src: templates/nginx/talk.conf.j2
    dest: /etc/nginx/sites-available/talk.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload nginx

- name: Enable Talk nginx site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/talk.conf
    dest: /etc/nginx/sites-enabled/talk.conf
    state: link
  notify:
    - Reload nginx

- name: Validate nginx configuration
  # Same stance as everywhere else here: a reload of a broken config
  # leaves the old one running, so the run would go green with the
  # vhost not actually serving.
  ansible.builtin.command:
    cmd: nginx -t
  changed_when: false

- name: Apply the nginx and container changes before configuring Nextcloud
  # The occ commands below register a backend Nextcloud will then call.
  # Registering one that is not yet answering makes Talk report the
  # backend as broken until something re-runs, so the handlers fire
  # first.
  ansible.builtin.meta: flush_handlers

- name: Read what Nextcloud already has registered
  # All three lists in one go. Their output carries the stored secrets,
  # so no_log - reading one of these unredacted is how two secrets ended
  # up in a terminal on 2026-08-16 and had to be rotated.
  ansible.builtin.command:
    cmd: "sudo -u www-data php occ {{ item }} --output=json"
    chdir: "{{ cloud.nextcloud.path }}"
  register: talk_registered
  loop:
    - talk:signaling:list
    - talk:turn:list
    - talk:stun:list
  loop_control:
    label: "{{ item }}"
  changed_when: false
  check_mode: false
  no_log: true

- name: Work out what needs changing
  # Parsed, not grepped. These secrets are base64 and JSON escapes "/"
  # as "\/", so a substring test against the raw output silently fails
  # for any secret containing a slash - which showed up as the delete
  # and re-add pair running on every single deploy.
  ansible.builtin.set_fact:
    talk_signaling_servers: >-
      {{ (talk_registered.results[0].stdout | from_json).servers
         | default([]) | map(attribute='server') | list }}
    talk_signaling_stored: >-
      {{ (talk_registered.results[0].stdout | from_json).secret
         | default('') }}
    talk_turn_stored: >-
      {{ talk_registered.results[1].stdout | from_json
         | selectattr('server', 'eq', talk_turn_server)
         | map(attribute='secret') | list }}
    talk_stun_servers: >-
      {{ talk_registered.results[2].stdout | from_json | default([]) }}
  vars:
    talk_turn_server: >-
      {{ talk.subdomain }}.{{ domain }}:{{ talk.turn_port }}
  no_log: true

- name: Remove a signaling entry whose secret has changed
  # `talk:signaling:add` appends and there is no "update", so rotating
  # a secret means deleting the entry first. Comparing the stored
  # secret is also what keeps this idempotent: unchanged, both tasks
  # skip.
  ansible.builtin.command:
    cmd: >-
      sudo -u www-data php occ talk:signaling:delete
      https://{{ talk.subdomain }}.{{ domain }}
    chdir: "{{ cloud.nextcloud.path }}"
  when:
    - talk_signaling_url in talk_signaling_servers
    - talk_signaling_stored != talk.secrets.signaling
  vars:
    talk_signaling_url: "https://{{ talk.subdomain }}.{{ domain }}"
  changed_when: true

- name: Register the signaling server with Nextcloud
  ansible.builtin.command:
    cmd: >-
      sudo -u www-data php occ talk:signaling:add
      https://{{ talk.subdomain }}.{{ domain }}
      {{ talk.secrets.signaling }} --verify
    chdir: "{{ cloud.nextcloud.path }}"
  when: >-
    talk_signaling_url not in talk_signaling_servers
    or talk_signaling_stored != talk.secrets.signaling
  vars:
    talk_signaling_url: "https://{{ talk.subdomain }}.{{ domain }}"
  changed_when: true
  no_log: true

- name: Remove a TURN entry whose secret has changed
  ansible.builtin.command:
    cmd: >-
      sudo -u www-data php occ talk:turn:delete turn
      {{ talk.subdomain }}.{{ domain }}:{{ talk.turn_port }} udp,tcp
    chdir: "{{ cloud.nextcloud.path }}"
  when:
    - talk_turn_stored | length > 0
    - talk_turn_stored | first != talk.secrets.turn
  changed_when: true

- name: Register the TURN server with Nextcloud
  ansible.builtin.command:
    cmd: >-
      sudo -u www-data php occ talk:turn:add turn
      {{ talk.subdomain }}.{{ domain }}:{{ talk.turn_port }} udp,tcp
      --secret={{ talk.secrets.turn }}
    chdir: "{{ cloud.nextcloud.path }}"
  when: >-
    talk_turn_stored | length == 0
    or talk_turn_stored | first != talk.secrets.turn
  changed_when: true
  no_log: true

- name: Register the STUN server with Nextcloud
  # The same host answers STUN on the TURN port. Without it clients
  # cannot discover their own public address and relay everything
  # through TURN - which works, but spends this host's bandwidth on
  # media that could have gone directly.
  ansible.builtin.command:
    cmd: >-
      sudo -u www-data php occ talk:stun:add
      {{ talk.subdomain }}.{{ domain }}:{{ talk.turn_port }}
    chdir: "{{ cloud.nextcloud.path }}"
  when: >-
    talk.subdomain ~ '.' ~ domain ~ ':' ~ talk.turn_port
    not in talk_stun_servers
  changed_when: true
