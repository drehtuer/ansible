argument_specs:
  main:
    short_description: Nextcloud Talk high-performance backend
    description:
      - Runs Nextcloud's aio-talk image, which bundles the signaling
        server, Janus as the WebRTC media gateway, NATS between them
        and eturnal as the TURN server, and registers all three with
        Nextcloud through occ.
      - Without it Talk still works peer to peer and stops scaling at
        roughly four participants, because every client then sends its
        stream to every other client.
    options:
      domain:
        type: str
        required: true
        description: Primary domain; the vhost and TURN name derive from it.
      http:
        type: dict
        required: true
        description:
          - Shared HTTP settings owned by the http role. Only
            `http.port_https` and `http.domains` are read here.
            Deliberately declared without suboptions.
      cloud:
        type: dict
        required: true
        description:
          - Shared with the cloud role; only `cloud.nextcloud.path` is
            read, to find occ. Deliberately declared without suboptions.
      talk:
        type: dict
        required: true
        description: Talk backend settings.
        options:
          image:
            type: str
            required: true
            description: Container image.
          tag:
            type: str
            required: true
            description: Image tag.
          digest:
            type: str
            required: true
            description:
              - Image digest. Pinned alongside the tag because a tag can
                be moved and a digest cannot.
          compose_dir:
            type: str
            required: true
            description: Where the compose file is written.
          subdomain:
            type: str
            required: true
            description:
              - Serves <subdomain>.<domain>. Must also appear in
                http.letsencrypt.subdomains or the vhost is served with
                a certificate that does not cover it.
          turn_port:
            type: int
            required: true
            description:
              - TURN port, TCP and UDP. The only port here that must be
                reachable from the public internet.
          signaling_port:
            type: int
            required: true
            description: Loopback port nginx proxies the WebSocket to.
          max_stream_bitrate:
            type: int
            required: true
            description: Per-stream bitrate ceiling, in bits per second.
          max_screen_bitrate:
            type: int
            required: true
            description: Screen-share bitrate ceiling, in bits per second.
          secrets:
            type: dict
            required: true
            description: The three shared secrets, none interchangeable.
            options:
              turn:
                type: str
                required: true
                description: Between clients and the TURN server.
              signaling:
                type: str
                required: true
                description: Between Nextcloud and the signaling server.
              internal:
                type: str
                required: true
                description: Between the signaling server's own components.
