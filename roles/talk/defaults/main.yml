talk:  # noqa: var-naming[no-role-prefix] - see doc/STATUS.adoc
  # nextcloud/aio-talk bundles every component the high-performance
  # backend needs - the signaling server, Janus as the WebRTC media
  # gateway, NATS between them, and eturnal as the TURN server - into
  # one image maintained by Nextcloud themselves. The alternative is
  # four containers wired together by hand from strukturag's images;
  # this is the same software, assembled by the people who ship Talk.
  #
  # Pinned by tag *and* digest, the stance `cloud` takes with
  # Nextcloud's checksum and `fail2ban_ui` with its image: a tag can be
  # moved under you, a digest cannot.
  image: nextcloud/aio-talk
  tag: "20260805_083533"
  digest: >-
    sha256:2b9a7d12d3e644b90c1fa6c7e73da0aa083719d64692bf40a62baaad3c2aebd1
  compose_dir: /etc/nextcloud-talk
  # Serves <subdomain>.<domain> for every entry in http.domains, and
  # must also appear in `http.letsencrypt.subdomains` or the vhost is
  # served with a certificate that does not cover it - the same
  # standing trap the `spam` and `fail2ban_ui` roles carry.
  subdomain: talk
  # TURN. This is the one port that must be reachable from the public
  # internet, on both TCP and UDP: it is how a participant behind a NAT
  # that blocks everything else still gets media through. 3478 is the
  # registered TURN port and the one clients try first.
  turn_port: 3478
  # Where the signaling server listens, on the host's loopback only.
  # The firewall would refuse it from outside in any case, but nginx is
  # what terminates TLS and proxies the WebSocket, so nothing else
  # should reach it.
  signaling_port: 8081
  # Per-stream bitrate ceilings the container applies to Janus. The
  # image's own defaults; named here so they are visible rather than
  # buried in a container.
  max_stream_bitrate: 1048576
  max_screen_bitrate: 2097152
  # Three separate shared secrets, all required, none interchangeable:
  #   turn       between clients and the TURN server
  #   signaling  between Nextcloud and the signaling server
  #   internal   between the signaling server's own components
  # Empty by default so the role cannot start a backend with guessable
  # credentials on a host nobody is watching.
  secrets:
    turn: ""
    signaling: ""
    internal: ""
