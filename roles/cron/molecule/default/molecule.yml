# Molecule scenario for the `cron` role. Run with
# `invoke test-molecule --role=cron`, or `molecule test` from
# roles/cron.
#
# The image is an init-enabled one: almost every role here uses
# `systemd_service`, which does nothing useful in a container that is
# not running systemd as PID 1. That is why a plain ubuntu:24.04
# image will not do.
driver:
  name: docker
platforms:
  - name: ansible-test-cron
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true
    command: /lib/systemd/systemd
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  name: ansible
verifier:
  name: ansible
