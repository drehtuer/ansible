# fail2ban filter for repeated 404s, i.e. bots probing for known
# vulnerable paths.
#
# The fail2ban package ships nginx-http-auth, nginx-botsearch,
# nginx-limit-req and nginx-bad-request, but no nginx-404, so the
# jail of that name needs this file.
#
# Matches the `main` log format defined in roles/http/files/nginx.conf:
#   $remote_addr - $remote_user [$time_local] "$request" $status
#   $body_bytes_sent "$http_referer" "$http_user_agent" host=$host
#
# fail2ban removes the timestamp before matching, which is why the
# bracket pair below is empty.

[Definition]

failregex = ^<HOST> - \S+ \[\] "[A-Z]+ [^"]*" 404 \d+

ignoreregex =

journalmatch =
