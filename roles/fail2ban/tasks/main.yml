- name: Install fail2ban
  ansible.builtin.apt:
    install_recommends: false
    name:
      - fail2ban
  notify:
    - Restart fail2ban
- name: Deploy custom filters
  # Filters the fail2ban package does not ship. Must land before
  # jail.local, or the jail referencing them fails to start.
  ansible.builtin.copy:
    src: files/filter.d/
    dest: /etc/fail2ban/filter.d/
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload fail2ban
- name: Configure fail2ban
  ansible.builtin.template:
    src: templates/jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload fail2ban
