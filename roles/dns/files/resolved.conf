[Resolve]
DNS=127.0.0.1
# allow-downgrade rather than yes: unbound already validates every
# answer before resolved sees it, and validating a second time here
# adds nothing while making resolved's weaker implementation a source
# of failures of its own. Queries still go to unbound only - verified
# by stopping it, after which resolution fails rather than falling
# back to the DHCP-provided server.
DNSSEC=allow-downgrade
DNSStubListener=yes
