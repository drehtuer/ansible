# Runs the same linters as `invoke lint`, on the committed state.
# See .yamllint, .ansible-lint and pyproject.toml for the rules.
name: Lint

"on":
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  yaml:
    name: YAML and Ansible
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # Same Ubuntu packages as the Dev Container, so CI and a local
      # run use the same linter versions.
      - name: Install linters
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            ansible \
            ansible-lint \
            yamllint

      # The runner image ships its own, newer ansible-core outside
      # /usr/bin. ansible-lint would call that CLI while importing the
      # apt python module and abort with "versions do not match", so
      # put /usr/bin first and keep the whole toolchain on one version.
      - name: Prefer the apt-installed ansible
        run: echo "/usr/bin" >> "${GITHUB_PATH}"

      # ansible.cfg points at vault/secret.txt, which is deliberately
      # never committed. ansible-lint only needs the file to exist, it
      # does not decrypt any vaulted values while linting.
      - name: Provide a placeholder vault password file
        run: |
          echo "not-the-real-vault-password" > "${RUNNER_TEMP}/vault-password"
          echo "ANSIBLE_VAULT_PASSWORD_FILE=${RUNNER_TEMP}/vault-password" >> "${GITHUB_ENV}"

      - name: yamllint
        run: yamllint --strict .

      - name: ansible-lint
        run: ansible-lint

  python:
    name: Python
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Keep in sync with RUFF_VERSION in .devcontainer/Dockerfile.
      - name: Install ruff
        run: pip install ruff==0.16.3

      - name: ruff check
        run: ruff check .

      - name: ruff format
        run: ruff format --check .
